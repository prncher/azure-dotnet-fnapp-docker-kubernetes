apiVersion: v1
kind: Service
metadata:
  name: lambdafunctionapp-app-service
spec:
  selector:
    app: lambdafunctionapp-app
  ports:
  - name: http
    protocol: TCP
    port: 30081
    targetPort: 80  # Replace with your application's port
  type: NodePort # Or ClusterIP, LoadBalancer depending on your needs
